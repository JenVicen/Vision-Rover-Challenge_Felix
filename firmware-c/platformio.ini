; Vision Rover Challenge - CenfoBot firmware (C / ESP-IDF)
;
; Dos entornos, uno por rover. La unica diferencia es ROVER_ID.
; Compilar y subir:
;
;   pio run -e rover10 -t upload
;   pio run -e rover11 -t upload

[platformio]
default_envs = rover10

; El directorio de compilacion se saca del repositorio a proposito.
;
; 1. Este proyecto vive dentro de OneDrive, que intenta sincronizar a la nube
;    cada uno de los ~2000 archivos .o que genera ESP-IDF. Eso ralentiza la
;    compilacion y llega a bloquear carpetas mientras el compilador escribe
;    en ellas (error "PermissionError / Access is denied").
; 2. ESP-IDF ademas NO admite espacios en las rutas del proyecto, y la ruta
;    real contiene "OneDrive - Intel Corporation".
;
; Por eso se compila desde el enlace C:\cenfobot (creado con
; `mklink /J C:\cenfobot "<ruta real>\firmware-c"`) y los objetos van a una
; carpeta fuera de la nube. Nada de esto se versiona.
build_dir = C:/cenfobot-build

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.f_cpu = 240000000L

[env:rover10]
build_flags = -DROVER_ID=10

[env:rover11]
build_flags = -DROVER_ID=11

; --- Pruebas de puesta a punto (ver README, seccion 5) ---
; Se compilan sobre el rover 10; cambiar a 11 si se prueba el otro.

[env:test1_motores]
build_flags = -DROVER_ID=10 -DSELFTEST=1

[env:test1_motores_rover11]
build_flags = -DROVER_ID=11 -DSELFTEST=1

[env:test2_recta]
build_flags = -DROVER_ID=10 -DSELFTEST=2

[env:test2_recta_rover11]
build_flags = -DROVER_ID=11 -DSELFTEST=2

[env:test3_sensores]
build_flags = -DROVER_ID=10 -DSELFTEST=3

[env:test3_sensores_rover11]
build_flags = -DROVER_ID=11 -DSELFTEST=3

[env:test4_vision]
build_flags = -DROVER_ID=10 -DSELFTEST=4

[env:test4_vision_rover11]
build_flags = -DROVER_ID=11 -DSELFTEST=4

[env:test5_giro]
build_flags = -DROVER_ID=10 -DSELFTEST=5

[env:test5_giro_rover11]
build_flags = -DROVER_ID=11 -DSELFTEST=5
